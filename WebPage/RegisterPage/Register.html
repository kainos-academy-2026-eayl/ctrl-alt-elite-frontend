<!DOCTYPE html>
<html lang="en">
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Ctrl-Alt-Elite | Register</title>
    <meta name="description" content="Create your Ctrl-Alt-Elite account.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="page-width header-content">
            <a class="brand" href="/" aria-label="Ctrl-Alt-Elite home">
                <span class="brand-mark" aria-hidden="true">C</span>
                <span>Ctrl-Alt-Elite</span>
            </a>
        </div>
    </header>

    <main>
        <div class="register-container">
            <p class="eyebrow">Join Ctrl-Alt-Elite</p>
            <h1>Create your account</h1>
            <h2>Please enter your details</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>
                </div>

                <p id="passwordMessage" role="status" aria-live="polite"></p>

                <button type="submit" class="register-btn">
                    Register
                </button>
            </form>

        </div>

        <!--[if lt IE 7]>
                <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
            <![endif]-->

        </div>
    </main>

    <footer class="site-footer">
        <div class="page-width">
            <p>&copy; <span data-current-year></span> Ctrl-Alt-Elite</p>
        </div>
    </footer>
    <script src="../script.js" defer></script>
</body>

</html>

</HTML>
