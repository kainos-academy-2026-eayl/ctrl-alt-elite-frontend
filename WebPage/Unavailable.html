g<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page unavailable | Ctrl-Alt-Elite</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #111827;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }

      main {
        max-width: 36rem;
      }

      h1 {
        margin: 0;
        color: #14532d;
        font-size: clamp(2rem, 7vw, 3.5rem);
      }

      p {
        margin: 1rem 0 1.5rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border-radius: 0.45rem;
        background: #15803d;
        color: #f8fafc;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #14532d;
      }

      a:focus-visible {
        outline: 3px solid #22c55e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Website temporarily unavailable</h1>
      <p>
        Sorry, we can’t load the home page right now. Please try again in a
        little while.
      </p>
      <a href="/">Try the home page again</a>
    </main>
  </body>
</html>
