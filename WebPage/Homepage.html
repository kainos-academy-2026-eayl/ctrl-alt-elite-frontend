<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Welcome to Ctrl-Alt-Elite. Log in or browse products." />
  <title>Ctrl-Alt-Elite | Home</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      background: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      min-width: 320px;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
    }

    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid #22c55e;
      outline-offset: 4px;
    }

    .page-width {
      width: min(100% - 2rem, 1120px);
      margin-inline: auto;
    }

    .site-header {
      border-bottom: 1px solid #14532d;
      background: #f8fafc;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: #14532d;
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 2.5rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 0.7rem;
      background: #15803d;
      color: #f8fafc;
      font-size: 1.1rem;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .nav-link {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 0.9rem;
      border: 2px solid transparent;
      border-radius: 0.4rem;
      color: #14532d;
      font-weight: 700;
      text-decoration: none;
    }

    .nav-link:hover {
      background: #dcfce7;
    }

    .nav-link-primary {
      border-color: #15803d;
      background: #15803d;
      color: #f8fafc;
    }

    .nav-link-primary:hover {
      border-color: #14532d;
      background: #14532d;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding-block: 4rem;
    }

    .welcome {
      max-width: 760px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #15803d;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #14532d;
      font-size: clamp(2.5rem, 8vw, 4.75rem);
      font-weight: 800;
      line-height: 1.05;
    }

    .welcome-copy {
      max-width: 570px;
      margin: 1.25rem auto 2rem;
      font-size: 1.125rem;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-width: 10rem;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border: 2px solid #15803d;
      border-radius: 0.45rem;
      background: #15803d;
      color: #f8fafc;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .button:hover {
      border-color: #14532d;
      background: #14532d;
    }

    .site-footer {
      padding-block: 1.25rem;
      background: #14532d;
      color: #f8fafc;
      text-align: center;
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 480px) {
      .page-width {
        width: min(100% - 1.5rem, 1120px);
      }

      .header-content {
        flex-direction: column;
        justify-content: center;
        gap: 0.5rem;
        min-height: 4.5rem;
        padding-block: 0.75rem;
      }

      .brand {
        font-size: 1rem;
      }

      .primary-nav {
        width: 100%;
        justify-content: center;
      }

      .nav-link {
        flex: 1;
      }

      .brand-mark {
        width: 2.2rem;
      }

      main {
        padding-block: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="page-width header-content">
      <a class="brand" href="/" aria-label="Ctrl-Alt-Elite home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>Ctrl-Alt-Elite</span>
      </a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a class="nav-link" href="/products">Browse products</a>
        <a class="nav-link nav-link-primary" href="/login">Log in</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-width welcome" aria-labelledby="welcome-heading">
      <p class="eyebrow">Welcome to Ctrl-Alt-Elite</p>
      <h1 id="welcome-heading">Find your next favourite.</h1>
      <p class="welcome-copy">
        Explore our collection and find something made for your everyday.
      </p>
      <a class="button" href="/products">Explore products</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="page-width">
      <p>&copy; Ctrl-Alt-Elite</p>
    </div>
  </footer>
</body>

</html>
