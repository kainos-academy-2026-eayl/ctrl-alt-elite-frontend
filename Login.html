<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Log in to your Ctrl-Alt-Elite account." />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./Login.css" />
  <title>Log in | Ctrl-Alt-Elite</title>
</head>

<body class="login-page">
  <header class="site-header">
    <div class="page-width header-content">
      <a class="brand" href="/" aria-label="Ctrl-Alt-Elite home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>Ctrl-Alt-Elite</span>
      </a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Log in</h1>
      <p class="login-copy">Welcome back. Enter your details to continue.</p>
      <form class="login-form" action="/login" method="post">
        <div class="login-field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="login-submit" type="submit">Log in</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="page-width">
      <p>&copy; <span data-current-year></span> Ctrl-Alt-Elite</p>
    </div>
  </footer>
  <script src="./Login.js" defer></script>
</body>

</html>
